server {
    listen 443 ssl;
    server_name cvetracker.example.com;

    access_log  /var/log/nginx/cvetracker.access.log;

    ssl_certificate           /etc/nginx/conf.d/cvetracker.example.com.crt;
    ssl_certificate_key       /etc/nginx/conf.d/cvetracker.example.com.key;

    ssl_session_cache  builtin:1000  shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    resolver 10.89.1.1 valid=10s ipv6=off;

    location / {
        set $upstream http://cvetracker:8897;
        proxy_pass          $upstream;

        proxy_set_header    Host $http_host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60;
    }
}
